server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: proxy al gateway (mismo origen → sin CORS, IP no se hornea en el build).
    # Resolver de Docker (127.0.0.11) + variable => nginx arranca aunque el
    # gateway aún no esté listo y reacciona si el gateway se reinicia.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $upstream_gw api-gateway;
        proxy_pass http://$upstream_gw:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # SPA: cualquier ruta desconocida cae en index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets con hash; index.html siempre revalida
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
